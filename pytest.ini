[pytest]
# Test configuration
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Verbose output
verbose = 1

# Show locals on test failure
showlocals = true

# Disable warnings
filterwarnings = ignore::DeprecationWarning

# Test paths
testpaths = tests

# Coverage (if pytest-cov is installed)
addopts = --cov=scripts --cov-report=term-missing --cov-report=html
