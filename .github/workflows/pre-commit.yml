name: Pre-commit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Install dependencies
        run: |
          pip install ruff black isort codespell types-requests types-PyYAML types-tqdm

      - name: Run pre-commit hooks on all files
        run: |
          pre-commit run --all-files --show-diff-on-failure

      - name: Verify pre-commit config is valid
        run: pre-commit validate-config

      - name: Check pre-commit is installed in git hooks
        run: |
          if [ -f .git/hooks/pre-commit ]; then
            echo "✅ Pre-commit hook is installed"
          else
            echo "❌ Pre-commit hook is NOT installed"
            exit 1
          fi
