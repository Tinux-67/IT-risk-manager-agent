version: '3.8'

services:
  # Main application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: it-risk-manager-agent
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=mistral
      - LOG_LEVEL=INFO
      - LOG_ROTATION=1 day
      - LOG_RETENTION=7 days
      - DEFAULT_DELAY=1.0
      - DATA_DIR=/app/data
      - RAW_DATA_DIR=/app/data/raw
      - PROCESSED_DIR=/app/data/processed
      - LOGS_DIR=/app/logs
      - DB_PATH=/app/data/processed/regulatory_updates.db
      - PYTHONUNBUFFERED=1
    user: "1000:1000"  # Run as non-root user to match Dockerfile
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app-network

  # Ollama for LLM support
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - app-network

  # Optional: Ollama model puller (runs once to download mistral model)
  ollama-setup:
    image: ollama/ollama:latest
    container_name: ollama-setup
    user: "1000:1000"  # Match non-root user
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 10
        ollama pull mistral
        echo "Mistral model downloaded successfully!"
    restart: on-failure
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  ollama-data:
